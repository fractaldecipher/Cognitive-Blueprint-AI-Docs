openapi: 3.0.3
info:
  title: Cognitive Blueprint — Innate Constitutional & Navigational Architecture
  version: 1.0.0
  description: >-
    High-precision lifelong navigational compass and constitutional architecture for AI agents, executive advisors, and autonomous systems.
    Computes invariant baselines, authentic decision dynamics, and talent transmutations from permanent spatiotemporal coordinates.


    Keywords: constitutional-ai, behavioral-telemetry, autonomous-agents, decision-intelligence, mentorship-tools, human-potential,
    executive-coaching, cognitive-architecture.


    ### 🏛️ The 5 Lifelong Criteria & Access Tiers

    - **Criterion 1 [Free Tier]**: `POST /v1/criterion/1` — Identity & Sovereign Architecture (9 Engines)

    - **Criterion 2 [Pro Tier]**: `POST /v1/criterion/2` — Blocks, Defense & Lineage Architecture (6 Engines)

    - **Criterion 3 [Pro Tier]**: `POST /v1/criterion/3` — Vocation, Craft & Capital Architecture (6 Engines)

    - **Criterion 4 [Mega Tier]**: `POST /v1/criterion/4` — Direction, Timing & Macro-Scaling Architecture (6 Engines)

    - **Criterion 5 [Mega Tier]**: `POST /v1/criterion/5` — Operating Dynamics, Somatics & Energy Protocols (6 Engines)


    Full documentation, engine specifications, and vector dictionaries: https://github.com/fractaldecipher/Cognitive-Blueprint-AI-Docs
  contact:
    name: Cognitive Blueprint Architecture Team
    url: https://github.com/fractaldecipher/Cognitive-Blueprint-AI-Docs
  license:
    name: Proprietary Commercial License
servers:
  - url: https://api.cognitiveblueprint.ai
    description: Production API Gateway (Configurable Deployment URL)
  - url: https://cognitive-blueprint-ai.p.rapidapi.com
    description: RapidAPI Managed Proxy Gateway
  - url: http://localhost:3000
    description: Local Development & Integration Environment
security:
  - RapidApiKey: []
    RapidApiHost: []
tags:
  - name: 'Criterion 1: Identity & Core Architecture'
    description: Foundational baseline of psychophysical constitution, decision-making mechanics, and sovereign identity across 9 engines (Free Tier).
  - name: 'Criterion 2: Inhibitors, Shadows & Structural Blocks'
    description: Somatic defense mechanisms, ancestral conditioning loops, and systemic energy leaks across 6 engines (Pro Tier).
  - name: 'Criterion 3: Vocation, Craft & Capital Architecture'
    description: Vocational calling, craft execution, market positioning, and capital architecture across 6 engines (Pro Tier).
  - name: 'Criterion 4: Direction, Evolution & Strategic Navigation'
    description: >-
      Strategic horizons: macro timing acceleration, spatial geometry, antifragility, and sovereign wealth navigation across 6 engines (Mega
      Tier).
  - name: 'Criterion 5: Operating Mode, Equilibrium & Bio-Prescriptions'
    description: >-
      Daily nervous system regulation, sensory intake, acoustic resonance, restorative rest, and biological energy hygiene across 6 engines
      (Mega Tier).
  - name: System Telemetry
    description: Service health check, latency verification, and container uptime probe.
