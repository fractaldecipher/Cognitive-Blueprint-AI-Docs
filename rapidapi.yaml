components:
  securitySchemes:
    RapidApiKey:
      type: apiKey
      name: X-RapidAPI-Key
      in: header
      description: Your RapidAPI personal subscription key.
    RapidApiHost:
      type: apiKey
      name: X-RapidAPI-Host
      in: header
      description: The RapidAPI host header.
  schemas:
    ProfileInput:
      type: object
      required:
        - name
        - birthDate
        - birthTime
        - timezoneOffset
        - latitude
        - longitude
        - gender
      description: Permanent spatiotemporal birth coordinates required to calculate the enduring constitutional blueprint.
      properties:
        name:
          type: string
          example: Nikola Tesla
          description: Full subject name or profile identifier.
        birthDate:
          type: string
          format: date
          example: '1856-07-10'
          description: Birth date in ISO format (YYYY-MM-DD).
        birthTime:
          type: string
          example: '00:00'
          description: Exact birth time in 24-hour format (HH:mm).
        timezoneOffset:
          type: number
          example: 1.02
          description: UTC timezone offset in decimal hours (e.g. +1.02 for Smiljan, Croatia in 1856).
        latitude:
          type: number
          example: 44.5809
          description: Birth geographic latitude in decimal degrees (-90.0 to +90.0).
        longitude:
          type: number
          example: 15.3
          description: Birth geographic longitude in decimal degrees (-180.0 to +180.0).
        gender:
          type: string
          enum:
            - male
            - female
          example: male
          description: Biological sex for constitutional hormonal and polar baselines.
    CriterionEnvelopeResponse:
      type: object
      description: Standard envelope format for single-criterion analytical queries.
      required:
        - status
        - criterionNumber
        - profile
        - totalActiveVectors
        - criterion
      properties:
        status:
          type: string
          example: success
          description: Execution status indicator.
        criterionNumber:
          type: integer
          example: 1
          description: Criterion index number (1 to 5).
        profile:
          $ref: '#/components/schemas/ProfileInput'
        totalActiveVectors:
          type: integer
          example: 45
          description: Total number of active standardized vectors emitted across all engines in this criterion.
        criterion:
          $ref: '#/components/schemas/CriterionResult'
    CriterionResult:
      type: object
      description: Detailed criterion payload containing aggregate thematic telemetry and engine-level breakdowns.
      required:
        - criterionId
        - title
        - totalVectors
        - coherenceScore
        - crossEngineAlerts
        - dominantTheme
        - engines
      properties:
        criterionId:
          type: integer
          example: 1
          description: 'Canonical criterion index (1: Identity, 2: Blocks, 3: Vocation, 4: Direction, 5: Operating).'
        title:
          type: string
          example: Identity & Sovereign Architecture
          description: Public title of the evaluated criterion.
        totalVectors:
          type: integer
          example: 45
          description: Total count of active vectors discovered in this criterion.
        coherenceScore:
          type: number
          example: 60
          description: Aggregate energetic and architectural coherence score (scale 0-100).
        crossEngineAlerts:
          type: array
          items:
            type: string
          example: []
          description: Canonical cross-engine alert codes triggered by systemic tensions (interpreted via ALERTS documentation).
        dominantTheme:
          type: string
          example: KINETIC_BUILDER_ARCHITECTURE
          description: Primary structural archetype or operational theme governing this criterion.
        engines:
          type: array
          items:
            $ref: '#/components/schemas/EngineResult'
    EngineResult:
      type: object
      description: Output payload for a single analytical engine within a criterion.
      required:
        - engineId
        - description
        - vectors
        - math
      properties:
        engineId:
          type: string
          example: engine_1
          description: Engine identifier mapping 1:1 to public documentation (e.g. engine_1.md).
        description:
          type: string
          example: What is my core life role, and through what natural compass do I make authentic decisions?
          description: The fundamental human inquiry answered by this engine.
        vectors:
          type: array
          items:
            type: string
          example:
            - VEC_ID_CORE_KINETIC_BUILDER
            - VEC_ID_DECISION_EMOTIONAL_WAVE
          description: Active standardized vector identifiers (looked up in public dictionaries).
        math:
          type: object
          description: Curated numerical telemetry metrics, each providing a quantified value and direct explanatory description.
          additionalProperties:
            type: object
            required:
              - value
              - description
            properties:
              value:
                type: number
                example: 95
                description: Quantified numeric score, percentage, latency, or ratio.
              description:
                type: string
                example: Energetic throughput capacity (scale 0-100, >75 indicates high sustained work output)
                description: Direct interpretation guide with scale and threshold meaning.
          example:
            throughputScore:
              value: 95
              description: Energetic throughput capacity (scale 0-100, >75 indicates high sustained work output)
            deliberationLatencyHours:
              value: 48
              description: Optimal deliberation window in hours required before making irreversible commitments
    ErrorResponse:
      type: object
      required:
        - status
        - error_type
        - message
      properties:
        status:
          type: string
          example: error
        error_type:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid input parameters.
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: birthDate
              message:
                type: string
                example: birthDate must be in YYYY-MM-DD format (e.g. 1990-05-15)
  responses:
    ValidationError:
      description: Bad Request (400) - Missing or invalid profile input parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            error_type: VALIDATION_ERROR
            message: Invalid input parameters
            errors:
              - field: birthDate
                message: birthDate must be in YYYY-MM-DD format (e.g. 1990-05-15)
    RateLimitError:
      description: Too Many Requests (429) - Subscription quota exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            error_type: RATE_LIMIT_EXCEEDED
            message: Too many requests. Please upgrade your RapidAPI subscription tier or wait before retrying.
    ServiceUnavailableError:
      description: Service Unavailable (503) - Computational engine backend temporarily unreachable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            error_type: SERVICE_UNAVAILABLE
            message: Computational engine pipeline temporarily unavailable. Please retry shortly.
